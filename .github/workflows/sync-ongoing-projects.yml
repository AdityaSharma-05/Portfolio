name: Sync ongoing projects

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync tagged repositories
        run: node scripts/sync-ongoing-projects.mjs
      - name: Commit updated project data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ongoing-projects.json
          git diff --cached --quiet || git commit -m "chore: sync ongoing projects"
          git push
